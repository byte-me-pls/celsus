# Windows installer for a version tag: builds the desktop app with its MCP server and attaches the installer to a
# draft GitHub release, to be checked and published by hand. The server image is built by docker.yml.
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          conf=$(grep -m1 '"version"' crates/celsus-desktop/tauri.conf.json | cut -d'"' -f4)
          test "$want" = "$have" && test "$want" = "$conf" || { echo "tag $want, Cargo.toml $have, tauri.conf.json $conf"; exit 1; }
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: MCP server
        run: cargo build --release --locked -p celsus-mcp
      - name: Installer
        working-directory: crates/celsus-desktop
        run: cargo tauri build --config release.conf.json
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/bundle/nsis/*-setup.exe \
            --draft --title "Celsus ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
      - name: Keep the installer (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: celsus-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
