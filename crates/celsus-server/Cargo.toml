[package]
name = "celsus-server"
description = "Celsus HTTP API and MCP endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
celsus-core.workspace = true
celsus-pdf.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
# Passwords, hashes, second-factor codes and encryption at rest.
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2.6"
chacha20poly1305 = "0.10"
getrandom = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
qrcodegen = "1.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
