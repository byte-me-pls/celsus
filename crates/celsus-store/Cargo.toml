[package]
name = "celsus-store"
description = "The Celsus library on disk: books, translation jobs, cached translations and settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
celsus-core.workspace = true
celsus-pdf.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
