[package]
name = "celsus-core"
description = "Translation and library logic shared by the Celsus server and desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
celsus-pdf.workspace = true
hayro = { version = "0.9.0", default-features = false }
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
png = "0.18.1"
