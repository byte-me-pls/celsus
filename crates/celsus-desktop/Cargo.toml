[package]
name = "celsus-desktop"
description = "Celsus desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
celsus-core.workspace = true
celsus-pdf.workspace = true
celsus-store.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-single-instance = "2.5.5"
