[workspace]
resolver = "3"
members = ["crates/celsus-core", "crates/celsus-pdf", "crates/celsus-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/byte-me-pls/celsus"

[workspace.dependencies]
celsus-core = { path = "crates/celsus-core" }
celsus-pdf = { path = "crates/celsus-pdf" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
